name: TokenUsage
options:
  bundleIdPrefix: com.tokenusage
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    # 团队经环境变量注入（README 部署手册有说明）；模拟器构建可留空
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"

# 结构说明（AGENTS.md）：共享代码在 Sources/TokenUsage（macOS SPM target），
# iOS 侧通过 include/exclude 复用同一批文件，不建独立 Core 模块、零 public 样板。
targets:
  TokenUsageiOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/TokenUsageiOS
      - path: Sources/TokenUsage
        excludes:
          # macOS 专属壳（@main 冲突 / AppKit）
          - "TokenUsageApp.swift"
          - "AppDelegate.swift"
          - "StatusBarController.swift"
          - "Views/MenuContent.swift"
    entitlements:
      path: Configs/TokenUsageiOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.tokenusage.ios
        keychain-access-groups:
          # Mac 版条目所在的 app-id 组（同 Team 即可加入），读 iCloud 钥匙串同步的 key
          - $(AppIdentifierPrefix)com.tokenusage.dev
    info:
      path: Configs/TokenUsageiOS-Info.plist
      properties:
        CFBundleDisplayName: TokenUsage
        UILaunchScreen: {}
        NSCameraUsageDescription: 扫描 Mac 版导出的二维码以导入 API key
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tokenusage.ios
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: TokenUsageWidget
    scheme: {}

  TokenUsageMac:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources/TokenUsage
      - path: Configs/Resources
        buildPhase: resources
    entitlements:
      path: Configs/TokenUsageMac.entitlements
      properties:
        # $(AppIdentifierPrefix) 签名时自动替换为 Team ID 前缀。写 synchronizable
        # 条目必须显式声明此组；设备已注册（2026-09-25）后自动签名可生成匹配 profile。
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.tokenusage.dev
    info:
      path: Configs/TokenUsageMac-Info.plist
      properties:
        CFBundleDisplayName: TokenUsage
        CFBundleIconFile: AppIcon
        LSUIElement: true
        NSHighResolutionCapable: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tokenusage.dev
        PRODUCT_NAME: TokenUsage
    scheme: {}

  TokenUsageWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/TokenUsageWidget
      - path: Sources/TokenUsage
        # 小组件只编入快照读取 + 模型 + 环形视图，不碰网络与 Keychain
        includes:
          - "SnapshotStore.swift"
          - "Models.swift"
          - "Views/UsageRingView.swift"
    entitlements:
      path: Configs/TokenUsageWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.tokenusage.ios
    info:
      path: Configs/TokenUsageWidget-Info.plist
      properties:
        CFBundleDisplayName: TokenUsage 小组件
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tokenusage.ios.widget
        SKIP_INSTALL: true
    # 不生成独立 scheme：app extension 无法独立运行（预览会报 "needs to be
    # embedded in an app"），预览一律用 TokenUsageiOS scheme 构建。
